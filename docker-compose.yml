services:
  facet:
    image: ${FACET_IMAGE:?set FACET_IMAGE to an immutable full-commit tag or digest}
    pull_policy: never
    command: ["run", "--state-dir", "/var/lib/facet/production", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - facet-state:/var/lib/facet
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  facet-setup:
    profiles: [setup]
    image: ${FACET_IMAGE:?set FACET_IMAGE to an immutable full-commit tag or digest}
    pull_policy: never
    entrypoint: ["facet"]
    command: ["setup", "--state-dir", "/var/lib/facet/production", "--oauth-client", "/run/secrets/google-client.json", "--port", "${FACET_OAUTH_PORT:-18080}", "--request-id", "${FACET_SETUP_REQUEST_ID:?set FACET_SETUP_REQUEST_ID to a private request key}"]
    ports:
      - "127.0.0.1:${FACET_OAUTH_PORT:-18080}:${FACET_OAUTH_PORT:-18080}"
    volumes:
      - facet-state:/var/lib/facet
    secrets:
      - source: google-client
        target: google-client.json
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"

volumes:
  facet-state:

secrets:
  google-client:
    file: ${FACET_OAUTH_CLIENT:?set FACET_OAUTH_CLIENT to a private Desktop client JSON}

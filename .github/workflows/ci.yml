name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Repository safety baseline
        run: bash scripts/check-repo-safety.sh
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Formatting
        run: uv run --frozen ruff format --check .
      - name: Offline tests
        run: uv run --frozen pytest
      - name: Spike CLI smoke check
        run: uv run --frozen facet-spike --help
      - name: Production CLI smoke check
        run: |
          uv run --frozen facet --help
          uv run --frozen facet --json --version
          uv run --frozen pytest tests/cli/test_bootstrap.py -q
